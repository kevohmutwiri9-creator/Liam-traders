services:
  # Django Backend Service
  - type: web
    name: liam-traders-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: liam-traders-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: liam-traders-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: liam-traders-backend.onrender.com,localhost,127.0.0.1
      - key: BASE_URL
        value: https://liam-traders-backend.onrender.com
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_ENVIRONMENT
        value: production
      - key: MINIMUM_WITHDRAWAL
        value: 100
      - key: WITHDRAWAL_FEE_PERCENTAGE
        value: 0.02
      - key: PLATFORM_FEE_PERCENTAGE
        value: 0.10

  # Next.js Frontend Service
  - type: web
    name: liam-traders-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: NEXT_PUBLIC_API_URL
        value: https://liam-traders-backend.onrender.com/api

databases:
  # PostgreSQL Database
  - name: liam-traders-db
    databaseName: liam_traders
    user: liam_traders

  # Redis for Celery
  - name: liam-traders-redis
    maxmemoryPolicy: allkeys-lru
